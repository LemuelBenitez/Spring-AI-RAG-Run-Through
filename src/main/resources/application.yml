spring:
  application:
    name: spring-ai-rag
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
  docker:
    compose:
      stop:
        command: down
        # This is the command to stop the docker compose services.
        # You can change it to 'stop' if you want to stop the services without removing them.
        # If I don't do this the data will be reuploaded to elasticsearch every time I restart the application.
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: llama3.2:1b
      embedding:
        model: nomic-embed-text
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: spring-ai-rag-nomic
        dimensions: 768

logging:
  level:
    root: INFO
